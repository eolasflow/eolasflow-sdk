[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eolasflow"
version = "0.1.0"
description = "Official Python SDK for the EolasFlow Voice AI API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EolasFlow", email = "hi@eolasflow.ai"},
]
keywords = ["eolasflow", "voice-ai", "sdk", "api", "voice-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://eolasflow.ai"
Documentation = "https://docs.eolasflow.ai"
Repository = "https://github.com/eolasflow/eolasflow-sdk"
Issues = "https://github.com/eolasflow/eolasflow-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["eolasflow"]
